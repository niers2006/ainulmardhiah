<!doctype html>
<html>
<head>
<title>Contact</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#fff7fa;
    animation:fadeIn 1.5s;
}

/* Animation */
@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* Header */
.welcome{
    width:80%;
    overflow:hidden;
    animation:slideDown 1s;
    align:center;
}

.welcome{
    width:100%;
    display:flex;
    justify-content:center;
    overflow:hidden;
    animation:slideDown 1s;
}

.welcome img{
    width:80%; 
    transition:0.5s;
}

@keyframes slideDown{
    from{
        transform:translateY(-50px);
        opacity:0;
    }
    to{
        transform:translateY(0);
        opacity:1;
    }
}

/* Menu */
.menu{
    background:#ffe4ec;
    text-align:center;
    padding:15px;
}

.menu a{
    text-decoration:none;
    margin:8px;
    padding:10px 18px;
    background:#d9f7ec;
    border-radius:20px;
    color:black;
    font-weight:bold;
    transition:0.4s;
    display:inline-block;
}

.menu a:hover{
    background:#ff8fab;
    color:white;
    transform:scale(1.1);
}

/* Content */
.content{
    padding:40px;
}

/* Title */
.content h1{
    color:#ff6f91;
    font-size:40px;
    text-align:center;
    margin-bottom:30px;
}

/* Contact layout */
.info{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
}

/* BOX */
.box{
    background:white;
    padding:20px;
    border-radius:20px;
    width:320px;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);
    text-align:center;
    transition:0.3s;
}

.box:hover{
    transform:scale(1.05);
}

/* Label */
.label{
    display:block;
    font-weight:bold;
    margin-bottom:10px;
    color:#444;
}

/* Hyperlink */
.box a{
    color:blue;
    font-weight:bold;
    text-decoration:underline;
    transition:0.3s;
}

.box a:hover{
    color:red;
}

.box a:visited{
    color:purple;
}

/* Footer */
.footer{
    background:#ffe4ec;
    text-align:center;
    padding:20px;
    margin-top:40px;
    color:#555;
}

</style>
